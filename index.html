<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLAS GENOM KULÜBÜ - Kayıt Formu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: rgba(3,87,131,255);
        }
        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo {
            max-width: 150px;
            height: auto;
        }
        .modal-content {
            border-radius: 15px;
            border: none;
        }
        .modal-header {
            background-color: rgba(3,87,131,255);
            color: white;
            border-radius: 15px 15px 0 0;
        }
        .modal-title {
            font-weight: bold;
        }
        .form-control:focus {
            border-color: rgba(3,87,131,255);
            box-shadow: 0 0 0 0.2rem rgba(3,87,131,0.25);
        }
        .btn-primary {
            background-color: rgba(3,87,131,255);
            border-color: rgba(3,87,131,255);
        }
        .btn-primary:hover {
            background-color: rgba(2,67,101,255);
            border-color: rgba(2,67,101,255);
        }
        .success-message {
            text-align: center;
            padding: 20px;
            color: #198754;
            font-weight: bold;
        }
        .error-message {
            text-align: center;
            padding: 20px;
            color: #dc3545;
            font-weight: bold;
        }
        .form-description {
            color: rgba(3,87,131,255);
            text-align: center;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .gallery-link {
            text-align: center;
            margin-top: 20px;
        }
        .gallery-link a {
            color: rgba(3,87,131,255);
            text-decoration: none;
            font-weight: 500;
        }
        .gallery-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- Kayıt Formu Modal -->
    <div class="modal fade show" id="registrationModal" tabindex="-1" style="display: block;">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <div class="logo-container">
                        <img src="logo.jpg" alt="ATLAS GENOM KULÜBÜ Logo" class="logo">
                    </div>
                    <h5 class="modal-title">ATLAS GENOM KULÜBÜ</h5>
                </div>
                <div class="modal-body">
                    <p class="form-description">Çekilişe kayıt olmak için formu doldurunuz</p>
                    <form id="registrationForm">
                        <div class="mb-3">
                            <label for="firstName" class="form-label">İsim</label>
                            <input type="text" class="form-control" id="firstName" required>
                        </div>
                        <div class="mb-3">
                            <label for="lastName" class="form-label">Soyisim</label>
                            <input type="text" class="form-control" id="lastName" required>
                        </div>
                        <div class="mb-3">
                            <label for="school" class="form-label">Okul</label>
                            <input type="text" class="form-control" id="school" required>
                        </div>
                        <div class="mb-3">
                            <label for="department" class="form-label">Bölüm</label>
                            <input type="text" class="form-control" id="department" required>
                        </div>
                        <div class="mb-3">
                            <label for="phone" class="form-label">Telefon Numarası</label>
                            <input type="tel" class="form-control" id="phone" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" id="saveButton">Kaydet</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
    <script>
        // Firebase yapılandırması
        const firebaseConfig = {
            databaseURL: "https://imsv1-5c3ac-default-rtdb.firebaseio.com/"
        };

        // Firebase'i başlat
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Telefon numarası kontrolü
        function checkExistingPhone(phone) {
            return database.ref('registrations')
                .orderByChild('phone')
                .equalTo(phone)
                .once('value')
                .then(snapshot => {
                    return snapshot.exists();
                });
        }

        // Kaydet butonu işlevi
        document.getElementById('saveButton').addEventListener('click', async function() {
            const phone = document.getElementById('phone').value;
            
            // Telefon numarası kontrolü
            const exists = await checkExistingPhone(phone);
            if (exists) {
                alert('Bu telefon numarası ile daha önce kayıt yapılmış!');
                return;
            }

            const formData = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                school: document.getElementById('school').value,
                department: document.getElementById('department').value,
                phone: phone,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            };

            // Verileri Firebase'e kaydet
            database.ref('registrations').push(formData)
                .then(() => {
                    // Formu temizle
                    document.getElementById('registrationForm').reset();
                    
                    // Başarı mesajı göster
                    const modalBody = document.querySelector('.modal-body');
                    modalBody.innerHTML = `
                        <div class="success-message">
                            <h4>Kayıt Başarılı!</h4>
                            <p>Çekilişe başarıyla kaydoldunuz.</p>
                        
                    `;
                    
                    // Kaydet butonunu gizle
                    document.querySelector('.modal-footer').style.display = 'none';
                })
                .catch((error) => {
                    console.error('Hata:', error);
                    alert('Kayıt sırasında bir hata oluştu. Lütfen tekrar deneyin.');
                });
        });
    </script>
</body>
</html>
