<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLAS GENOM KULÜBÜ - Fotoğraf Galerisi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: rgba(3,87,131,255);
        }
        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo {
            max-width: 150px;
            height: auto;
        }
        .gallery-container {
            max-width: 800px;
            margin: 30px auto;
            text-align: center;
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .main-image {
            width: 100%;
            max-height: 500px;
            object-fit: contain;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .navigation-btn {
            background-color: rgba(3,87,131,255);
            border: none;
            padding: 10px 30px;
            font-size: 1.2rem;
            margin: 0 10px;
        }
        .navigation-btn:hover {
            background-color: rgba(2,67,101,255);
        }
        h1 {
            color: rgba(3,87,131,255);
            margin-bottom: 20px;
            font-weight: bold;
        }
        h2 {
            color: #6c757d;
            margin-bottom: 30px;
        }
        .image-counter {
            color: #6c757d;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="gallery-container">
        <div class="logo-container">
            <img src="logo.jpg" alt="ATLAS GENOM KULÜBÜ Logo" class="logo">
        </div>
        <h1>ATLAS GENOM KULÜBÜ</h1>
        <h2>Fotoğraf Galerisi</h2>
        
        <img id="mainImage" class="main-image" src="" alt="Galeri Fotoğrafı">
        <p id="imageCounter" class="image-counter"></p>
        
        <div class="mt-4">
            <button id="prevBtn" class="btn btn-primary navigation-btn">Önceki</button>
            <button id="nextBtn" class="btn btn-primary navigation-btn">Sonraki</button>
        </div>
    </div>

    <script>
        let currentImageIndex = 0;
        // Görselleri statik olarak tanımla
        const images = [
            'https://i.ibb.co/fYF2WT52/k-t.png',
            'https://i.ibb.co/4RQZDBGv/ecem.png'
            
        ];

        function showImage(index) {
            if (images.length === 0) return;
            
            currentImageIndex = (index + images.length) % images.length;
            document.getElementById('mainImage').src = images[currentImageIndex];
            document.getElementById('imageCounter').textContent = 
                `Fotoğraf ${currentImageIndex + 1} / ${images.length}`;
        }

        document.getElementById('prevBtn').addEventListener('click', () => {
            showImage(currentImageIndex - 1);
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            showImage(currentImageIndex + 1);
        });

        // Klavye kontrolleri
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                showImage(currentImageIndex - 1);
            } else if (e.key === 'ArrowRight') {
                showImage(currentImageIndex + 1);
            }
        });

        // Sayfa yüklendiğinde ilk fotoğrafı göster
        showImage(0);
    </script>
</body>
</html>
